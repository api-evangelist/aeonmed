name: aeonmed
description: Beijing Aeonmed Co., Ltd. is a Chinese medical device manufacturer founded in 2001 and
  headquartered in Fengtai District, Beijing. Aeonmed researches, designs, and manufactures anesthesia
  and respiratory equipment for operating rooms and intensive care units, including anesthesia machines,
  ICU and emergency/transport ventilators, operating tables, surgical lights, ceiling pendants, patient
  monitors, infusion and syringe pumps, homecare CPAP/BiPAP devices, high-flow oxygen therapy, and
  digital OR/ICU system solutions. 61 of its products carry EU CE certification and its equipment is
  sold in more than 160 countries. In 2019 Aeonmed acquired HEYER Medical AG of Germany. The company is
  a portfolio company of Qiming Venture Partners. Aeonmed publishes no public API or developer program.
